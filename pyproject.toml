[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohortkit"
version = "0.1.0"
description = "CLI for turning a book's chapters into a live, facilitated cohort curriculum — sessions and a rubric as source, a student handout and a facilitator guide as build artifacts"
license = "EUPL-1.2"
requires-python = ">=3.10"
dependencies = [
    "content-kit-core @ git+https://github.com/alpibrusl/content-kit@main#subdirectory=packages/core",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
cohortkit = "cohortkit.cli:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cohortkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # typer.Option() in defaults — intended pattern for typer CLIs
    "SIM108", # ternary collapse — sometimes less readable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # assert is fine in tests

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/cohortkit"]

[tool.coverage.report]
show_missing = true
skip_covered = false
